services:
  model:
    image: vllm/vllm-openai:v0.22.1
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - --model=/model
      - --served-model-name=Qwen3.5-2B
      - --host=0.0.0.0
      - --port=8000

      # 1. ÉP XUNG VRAM TUYỆT ĐỐI: Dùng 99% VRAM, mở rộng tối đa hồ chứa KV Cache
      - --gpu-memory-utilization=0.99

      # 2. GIẢM METADATA CPU: 16384 là mốc hợp lý (vì 8192 đã chết ở bài test mồi). 
      # Giúp block table nhẹ đi một nửa so với 32768.
      - --max-model-len=16384

      # Tham số gốc (Không thêm cờ lạ để tránh exited 2)
      - --tensor-parallel-size=1
      - --enable-prefix-caching

    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
