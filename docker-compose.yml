services:
  model:
    # Trỏ đến image bạn vừa build và push lên hub
    image: your-dockerhub-user/viettel-qwen35-2b:v1-bf16
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      # GIỮ NGUYÊN CÁC DÒNG NÀY 
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=Qwen3.5-2B #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server

      # CÁC BIẾN SỐ A/B TESTING CỦA BẠN SẼ NẰM Ở ĐÂY
      - --max-model-len=32768
      - --gpu-memory-utilization=0.95
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      # Ví dụ các tham số bạn sẽ test ở Tuần 3:
      # - --max-num-seqs=64
      # - --max-num-batched-tokens=1024
      # - --num-scheduler-steps=8
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
