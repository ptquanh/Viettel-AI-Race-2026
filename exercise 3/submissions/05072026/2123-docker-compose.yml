services:
  model:
    image: vllm/vllm-openai:v0.22.1
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - --model=/model
      - --served-model-name=Qwen3.5-2B
      - --host=0.0.0.0
      - --port=8000

      # Giữ nguyên để vượt qua bài test mồi (Primer) của BTC
      - --max-model-len=262144

      # --- ĐÒN QUYẾT ĐỊNH: Nâng giới hạn để hấp thụ trọn bộ 120 requests cùng lúc ---
      - --max-num-seqs=256

      # Tham số gốc của BTC
      - --gpu-memory-utilization=0.95
      - --tensor-parallel-size=1
      - --enable-prefix-caching
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
