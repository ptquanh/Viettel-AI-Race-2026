services:
  model:
    # Sử dụng image gốc của BTC
    image: vllm/vllm-openai:v0.22.1
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - --model=/model
      - --served-model-name=Qwen3.5-2B
      - --host=0.0.0.0
      - --port=8000

      # Tham số gốc của BTC (giữ nguyên để cô lập biến thử nghiệm)
      - --max-model-len=262144
      - --gpu-memory-utilization=0.95

      # --- ĐƠN BIẾN THỬ NGHIỆM SLOT 1 (06/07) ---
      # Bật chunked prefill trên baseline image gốc để xem có được vLLM v0.22.1 hỗ trợ không
      - --enable-chunked-prefill

      # Tham số bắt buộc giữ nguyên
      - --tensor-parallel-size=1
      - --enable-prefix-caching
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
