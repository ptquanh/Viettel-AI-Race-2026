services:
  model:
    # Sử dụng image gốc của BTC
    image: vllm/vllm-openai:v0.22.1
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - --model=/model
      - --served-model-name=Qwen3.5-2B
      - --host=0.0.0.0
      - --port=8000
      
      # Tham số gốc của BTC
      - --max-model-len=262144
      - --gpu-memory-utilization=0.95
      
      # --- CẤU HÌNH THÀNH CÔNG GẦN NHẤT (Baseline mới) ---
      - --enable-chunked-prefill
      
      # --- ĐƠN BIẾN THỬ NGHIỆM SLOT 2 (06/07) ---
      # Bật FP8 KV Cache để kiểm tra khả năng tương thích và giảm dung lượng VRAM lưu cache
      - --kv-cache-dtype=fp8
      
      # Tham số bắt buộc giữ nguyên
      - --tensor-parallel-size=1
      - --enable-prefix-caching
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
