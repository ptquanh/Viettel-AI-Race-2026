services:
  model:
    image: vllm/vllm-openai:v0.22.1
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - --model=/model
      - --served-model-name=Qwen3.5-2B
      - --host=0.0.0.0
      - --port=8000
      
      # --- ĐƠN BIẾN THỬ NGHIỆM SLOT 10 (06/07) ---
      - --max-model-len=65536
      
      - --gpu-memory-utilization=0.95
      - --enable-chunked-prefill
      - --no-enable-log-requests
      - --tensor-parallel-size=1
      - --enable-prefix-caching
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
