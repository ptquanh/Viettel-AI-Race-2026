services:
  model:
    image: lmsysorg/sglang:v0.4.6.post1
    shm_size: "8g"
    environment:
      - CUDA_VISIBLE_DEVICES=0
    entrypoint: [ "python3", "-m", "sglang.launch_server" ]
    command:
      - --model-path
      - /model
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --quantization
      - fp8
      - --context-length
      - "65536"
      - --mem-fraction-static
      - "0.88"
      - --max-running-requests
      - "64"
      - --disable-cuda-graph
      - --served-model-name
      - Qwen3.5-2B
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
