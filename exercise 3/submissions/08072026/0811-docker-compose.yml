services:
  model:
    image: aphroditeorg/aphrodite:latest
    # 7.4GB – pull OK – tested < 90s on Viettel grader
    # Qwen3.5-2B – FP8 weights – NO AWQ file needed
    # Best Config STT21 ported: --quantization=fp8 + chunked_prefill + prefix_caching
    entrypoint: ["python3", "-m", "aphrodite.endpoints.openai.api_server"]
    command:
      - --model=/model
      - --served-model-name=Qwen3.5-2B
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=262144
      - --gpu-memory-utilization=0.93
      - --tensor-parallel-size=1
      - --dtype=auto
      - --quantization=fp8
      - --kv-cache-dtype=auto
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --max-num-batched-tokens=8192
      # DO NOT add on v0.22.1-compat mode:
      # --max-num-partial-prefills --long-prefill-token-threshold --enforce-eager
      # tested – exit 2 / timeout 2700s – STT5,6,20,22
    environment:
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=1
      - TOKENIZERS_PARALLELISM=false
      - VLLM_USE_FASTOKENS=1
      - VLLM_NO_USAGE_STATS=1
      - HF_HUB_OFFLINE=1
    ports:
      - "8000:8000"
    shm_size: "4g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

