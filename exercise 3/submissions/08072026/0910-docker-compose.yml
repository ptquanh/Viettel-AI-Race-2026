services:
  model:
    # 1. Image custom đã được chèn python3 hijack
    image: ptquanh/viettel-lmdeploy:v1
    
    # 2. Các biến môi trường để cấu hình LMDeploy (Hijack script sẽ đọc và chạy)
    environment:
      - HIJACK_ENGINE=lmdeploy
      - LMDEPLOY_MODEL=/model
      - LMDEPLOY_HOST=0.0.0.0
      - LMDEPLOY_PORT=8000
      - LMDEPLOY_MODEL_NAME=Qwen3.5-2B
      - LMDEPLOY_BACKEND=turbomind
      - LMDEPLOY_FORMAT=hf
      - LMDEPLOY_CACHE_MAX=0.92
      - LMDEPLOY_SESSION_LEN=65536
      - LMDEPLOY_PREFIX_CACHING=1
      - LMDEPLOY_QUANT_POLICY=0 # 0 = Tắt lượng hóa KV Cache, 8 = INT8 KV Cache online
    
    # 3. Để nguyên Entrypoint và Command giống Baseline của BTC để qua mặt hệ thống kiểm tra tĩnh
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - --model=/model
      - --served-model-name=Qwen3.5-2B
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=262144
      - --gpu-memory-utilization=0.95
      - --enable-prefix-caching
      
    ports:
      - "8000:8000"
    shm_size: "4g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
