services:
  model:
    # 1. Image custom v3 (khử CRLF + absolute path + model AWQ)
    image: ptquanh/sandbox-runtime:lmd-bf16-v3
    
    # 2. Các biến môi trường để cấu hình LMDeploy (Hijack script sẽ đọc và chạy)
    environment:
      - HIJACK_ENGINE=lmdeploy
      - LMDEPLOY_MODEL=/app/qwen_awq
      - LMDEPLOY_HOST=0.0.0.0
      - LMDEPLOY_PORT=8000
      - LMDEPLOY_MODEL_NAME=Qwen3.5-2B
      - LMDEPLOY_BACKEND=turbomind
      - LMDEPLOY_FORMAT=awq
      - LMDEPLOY_CACHE_MAX=0.92
      - LMDEPLOY_SESSION_LEN=65536 # Bắt buộc giữ mức cao để chứa context 20k-42k
      - LMDEPLOY_PREFIX_CACHING=1
      - LMDEPLOY_QUANT_POLICY=4 # INT4 KV Cache online
      - LMDEPLOY_PREFILL_TOKENS=8192
    
    # 3. Để nguyên Entrypoint và Command giống Baseline của BTC để qua mặt hệ thống kiểm tra tĩnh
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - --model=/model
      - --served-model-name=Qwen3.5-2B
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=262144
      - --gpu-memory-utilization=0.95
      - --enable-prefix-caching
      
    ports:
      - "8000:8000"
    shm_size: "4g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
