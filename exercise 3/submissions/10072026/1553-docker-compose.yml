services:
  model:
    image: ptquanh/sandbox-runtime:vllm-v0.22.1-hijack-v3
    environment:
      - HIJACK_ENGINE=vllm-v22-v3
      - VLLM_MAX_NUM_SEQS=48
      - VLLM_ENABLE_CHUNKED_PREFILL=0
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - --model=/model
      - --served-model-name=Qwen3.5-2B
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=262144
      - --gpu-memory-utilization=0.95
      - --enable-prefix-caching
    ports:
      - "8000:8000"
    shm_size: "4g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
