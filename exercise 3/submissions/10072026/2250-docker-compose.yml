# STT 73 - TurboQuant 4-bit KV Cache (Norm Correction) 🔥
# Mục đích: Test cờ nén INT4 KV cache thực tế được portal hỗ trợ
# Cấu hình: --kv-cache-dtype turboquant_4bit_nc + --quantization fp8 (hijack-v4)
# Kỳ vọng: TPOT giảm từ 51ms → ~19ms (băng thông KV cache giảm ~3.8x) mà không gây OOM
services:
  model:
    image: ptquanh/sandbox-runtime:vllm-v0.22.1-hijack-v4
    environment:
      - HIJACK_ENGINE=vllm-v22-v4
      - VLLM_KV_CACHE_DTYPE=turboquant_4bit_nc
      - VLLM_QUANTIZATION=fp8
      - VLLM_ENABLE_CHUNKED_PREFILL=0
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - --model=/model
      - --served-model-name=Qwen3.5-2B
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=262144
      - --gpu-memory-utilization=0.95
      - --enable-prefix-caching
    ports:
      - "8000:8000"
    shm_size: "4g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
