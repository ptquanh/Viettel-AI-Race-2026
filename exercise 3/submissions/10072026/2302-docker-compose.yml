# STT 74 - TurboQuant FP8-INT4 Hybrid KV Cache 🔥 (Đổi tên từ 2251 thành 2302)
# Mục đích: Test cờ nén lai FP8 Keys + 4-bit Values được portal hỗ trợ
# Cấu hình: --kv-cache-dtype turboquant_k8v4 + --quantization fp8 (hijack-v4)
# Kỳ vọng: TPOT giảm từ 51ms → ~25ms (băng thông KV cache giảm ~2.6x), đảm bảo accuracy ổn định hơn 4-bit thuần.
services:
  model:
    image: ptquanh/sandbox-runtime:vllm-v0.22.1-hijack-v4
    environment:
      - HIJACK_ENGINE=vllm-v22-v4
      - VLLM_KV_CACHE_DTYPE=turboquant_k8v4
      - VLLM_QUANTIZATION=fp8
      - VLLM_ENABLE_CHUNKED_PREFILL=0
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - --model=/model
      - --served-model-name=Qwen3.5-2B
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=262144
      - --gpu-memory-utilization=0.95
      - --enable-prefix-caching
    ports:
      - "8000:8000"
    shm_size: "4g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
