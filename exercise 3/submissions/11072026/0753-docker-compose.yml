# STT 79 - Prefix Cache Warmup via hijack v5 + FP8 weights + Max Memory
# Mục đích: Giống STT 78 nhưng tăng gpu-memory-utilization lên 0.97.
# Kỳ vọng: Mở rộng KV cache pool để giữ prefix cache không bị evict (bị xóa) khi traffic lên cao, đảm bảo prefix cache tồn tại cho đến tận batch thứ 6.
services:
  model:
    image: ptquanh/sandbox-runtime:vllm-v0.22.1-hijack-v5
    environment:
      - HIJACK_ENGINE=vllm-v22-v5
      - VLLM_KV_CACHE_DTYPE=auto
      - VLLM_QUANTIZATION=fp8
      - VLLM_WARMUP_PREFIX=1
      - VLLM_MAX_NUM_SEQS=256
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - --model=/model
      - --served-model-name=Qwen3.5-2B
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=262144
      - --gpu-memory-utilization=0.97
      - --enable-prefix-caching
      - --no-enable-log-requests
    ports:
      - "8000:8000"
    shm_size: "4g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
