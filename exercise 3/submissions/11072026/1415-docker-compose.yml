# STT 82 - FP8 weights + Chunked Prefill (chunk 4096) - Fixed 🔥
# Mục đích: Bản sửa lỗi cho STT 81 (1147). Kết hợp quantization weights FP8 với Chunked Prefill 4096 tokens.
# Cách sửa: Loại bỏ phần '=True' bị lỗi cú pháp của cờ --enable-chunked-prefill.
services:
  model:
    image: vllm/vllm-openai:v0.22.1
    environment:
      - OMP_NUM_THREADS=3
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - --model=/model
      - --served-model-name=Qwen3.5-2B
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=262144
      - --gpu-memory-utilization=0.95
      - --enable-prefix-caching
      - --no-enable-log-requests
      - --quantization=fp8
      - --enable-chunked-prefill
      - --max-num-batched-tokens=4096
    ports:
      - "8000:8000"
    shm_size: "4g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
