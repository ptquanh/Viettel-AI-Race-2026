# STT 88 - FP8 weights + Chunked Prefill (chunk 4096) + disable-async-output-proc
# Mục đích: Thử nghiệm tắt async output processing để giảm tải cho CPU (vì CPU chỉ có 3 core).
services:
  model:
    image: vllm/vllm-openai:v0.22.1
    environment:
      - OMP_NUM_THREADS=3
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - --model=/model
      - --served-model-name=Qwen3.5-2B
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=262144
      - --gpu-memory-utilization=0.95
      - --enable-prefix-caching
      - --no-enable-log-requests
      - --disable-log-stats
      - --quantization=fp8
      - --enable-chunked-prefill
      - --max-num-batched-tokens=4096
      - --disable-async-output-proc
    ports:
      - "8000:8000"
    shm_size: "4g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
