# Slot 3: Seqs=48, Len=[Best Len] — Concurrency sweep (chờ kết quả Slot 1)
# TODO: Thay [Best Len] bằng giá trị tối ưu nhất từ Slot 1 (16384 hoặc 32768)
services:
  model:
    image: ptquanh/sandbox-runtime:vllm-lfm25-fp8-kernels-v1
    environment:
      - OMP_NUM_THREADS=2
      - VLLM_WARMUP=1
      - VLLM_CUSTOM_KERNEL=1
      - VLLM_MAX_NUM_SEQS=48
      - VLLM_QUANTIZATION=fp8
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - --model=/model
      - --served-model-name=LFM2.5-1.2B-Instruct
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=32768
      - --gpu-memory-utilization=0.95
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --no-enable-log-requests
      - --disable-log-stats
      - --compilation-config={"level":3}
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
