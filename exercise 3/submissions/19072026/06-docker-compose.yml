# Slot 6: Speculative Decoding (Lower Bound) — Draft LFM-350M, Spec_Tokens=3
services:
  model:
    image: ptquanh/sandbox-runtime:vllm-lfm25-fp8-kernels-v2
    environment:
      - OMP_NUM_THREADS=2
      - VLLM_WARMUP=1
      - VLLM_CUSTOM_KERNEL=1
      - VLLM_MAX_NUM_SEQS=32
      - VLLM_MAX_MODEL_LEN=32768
      - VLLM_GPU_MEMORY_UTILIZATION=0.95
      - VLLM_TENSOR_PARALLEL_SIZE=1
      - VLLM_COMPILATION_LEVEL=3
      - VLLM_QUANTIZATION=fp8
      - VLLM_SPECULATIVE_MODEL=LiquidAI/LFM2.5-350M-Instruct
      - VLLM_NUM_SPECULATIVE_TOKENS=3
      - VLLM_SPECULATIVE_DISABLE_MQA_SCORER=1
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
