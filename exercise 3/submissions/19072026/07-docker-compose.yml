# Slot 7: Speculative Decoding (Upper Bound) — Draft LFM-350M, Spec_Tokens=6 + Quant=compressed-tensors (Baseline Kỷ lục Mới 61.13đ)
services:
  model:
    image: ptquanh/sandbox-runtime:vllm-lfm25-fp8-kernels-v2
    environment:
      - OMP_NUM_THREADS=2
      - VLLM_CUSTOM_KERNEL=1
      - VLLM_WARMUP=1
      - VLLM_SPECULATIVE_MODEL=LiquidAI/LFM2.5-350M-Instruct
      - VLLM_NUM_SPECULATIVE_TOKENS=6
      - VLLM_SPECULATIVE_DISABLE_MQA_SCORER=1
      - VLLM_QUANTIZATION=fp8
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - --model=/model
      - --served-model-name=LFM2.5-1.2B-Instruct
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=32768
      - --gpu-memory-utilization=0.95
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --no-enable-log-requests
      - --disable-log-stats
      - --compilation-config={"level":3}
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
