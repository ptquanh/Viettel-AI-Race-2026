# Slot 8: Speculative Decoding (Sweet Spot) — Draft LFM-350M, Spec_Tokens=[Sweet Spot]
# TODO: Thay [Sweet Spot] dựa trên kết quả Slot 6 (Spec=3) và Slot 7 (Spec=6). Thay [Best Seqs] và [Best Len] từ Slots 1-3.
services:
  model:
    image: ptquanh/sandbox-runtime:vllm-lfm25-fp8-kernels-v2
    environment:
      - OMP_NUM_THREADS=2
      - VLLM_CUSTOM_KERNEL=1
      - VLLM_WARMUP=1
      - VLLM_SPECULATIVE_MODEL=LiquidAI/LFM2.5-350M-Instruct
      - VLLM_NUM_SPECULATIVE_TOKENS=5
      - VLLM_SPECULATIVE_DISABLE_MQA_SCORER=1
      - VLLM_QUANTIZATION=fp8
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - --model=/model
      - --served-model-name=LFM2.5-1.2B-Instruct
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=32768
      - --gpu-memory-utilization=0.95
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --no-enable-log-requests
      - --disable-log-stats
      - --compilation-config={"level":3}
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
