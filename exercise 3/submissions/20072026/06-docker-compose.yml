# Slot 6 (20/07): Image v4.1 - Deep Warmup + Seqs=28 (Queueing Optimization)
# MỤC TIÊU: Giảm max_num_seqs từ 32 xuống 28 để giảm nhẹ độ tranh chấp hàng đợi (Queueing Contention), hạ trễ đợt Poisson burst 4.4K tokens, đưa số request Failed từ 5-6 về 0.
services:
  model:
    image: ptquanh/sandbox-runtime:vllm-lfm25-fp8-kernels-v4
    environment:
      - OMP_NUM_THREADS=2
      - VLLM_WARMUP=1
      - VLLM_CUSTOM_KERNEL=1
      - VLLM_MAX_NUM_SEQS=28
      - VLLM_MAX_MODEL_LEN=32768
      - VLLM_GPU_MEMORY_UTILIZATION=0.95
      - VLLM_TENSOR_PARALLEL_SIZE=1
      - VLLM_COMPILATION_LEVEL=3
      - VLLM_QUANTIZATION=fp8
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
