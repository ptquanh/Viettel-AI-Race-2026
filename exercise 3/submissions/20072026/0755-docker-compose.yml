# Slot 1 (20/07): RE-TEST H3 — Max Model Len 8192 trên Image v2
# MỤC TIÊU: Test thực sự Max Len 8K (chưa bao giờ test trên v2!)
# Context tối đa trong trace chỉ ~4700 tokens → 8192 đủ dư
services:
  model:
    image: ptquanh/sandbox-runtime:vllm-lfm25-fp8-kernels-v2
    environment:
      - OMP_NUM_THREADS=2
      - VLLM_WARMUP=1
      - VLLM_CUSTOM_KERNEL=1
      - VLLM_MAX_NUM_SEQS=32
      - VLLM_MAX_MODEL_LEN=8192
      - VLLM_GPU_MEMORY_UTILIZATION=0.95
      - VLLM_TENSOR_PARALLEL_SIZE=1
      - VLLM_COMPILATION_LEVEL=3
      - VLLM_QUANTIZATION=fp8
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
