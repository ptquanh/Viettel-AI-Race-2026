# Slot 2 (20/07): Re-test Max Model Len 16384 (16K) thực sự trên Image v2
# MỤC TIÊU: Test thực sự mốc 16K trên Image v2 (STT 46 ở v1 đã bị hijack hardcode 32K!)
# 8K = 59.29đ, 32K = 60.75đ-61.13đ → Kiểm chứng xem 16K có phải điểm ngọt (sweet spot) giữa 8K và 32K không.
services:
  model:
    image: ptquanh/sandbox-runtime:vllm-lfm25-fp8-kernels-v2
    environment:
      - OMP_NUM_THREADS=2
      - VLLM_WARMUP=1
      - VLLM_CUSTOM_KERNEL=1
      - VLLM_MAX_NUM_SEQS=32
      - VLLM_MAX_MODEL_LEN=16384
      - VLLM_GPU_MEMORY_UTILIZATION=0.95
      - VLLM_TENSOR_PARALLEL_SIZE=1
      - VLLM_COMPILATION_LEVEL=3
      - VLLM_QUANTIZATION=fp8
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
