# Slot 8 (20/07) - 1325: Image v5 - Custom Kernel Fusion
# MỤC TIÊU: Tích hợp monkey patch Triton Kernel Fusion (gộp LayerNorm + Conv + SiLU). Ép TPOT < 3ms.
services:
  model:
    image: ptquanh/sandbox-runtime:vllm-lfm25-fp8-kernels-v5
    environment:
      - OMP_NUM_THREADS=2
      - VLLM_WARMUP=1
      - VLLM_CUSTOM_KERNEL=1
      - VLLM_MAX_NUM_SEQS=32
      - VLLM_MAX_MODEL_LEN=32768
      - VLLM_GPU_MEMORY_UTILIZATION=0.95
      - VLLM_TENSOR_PARALLEL_SIZE=1
      - VLLM_COMPILATION_LEVEL=3
      - VLLM_QUANTIZATION=fp8
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
