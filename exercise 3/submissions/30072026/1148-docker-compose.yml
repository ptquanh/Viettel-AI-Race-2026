# FUSION CONFIG: Humming W4 Image (from #16 0851) + INT4 Marlin + FP8 KV Cache (from #15 1529)
# Target: 70+ ERS (Best of both worlds)
# Rationale:
#   - Image sha256:2f1c (Humming W4 channel-wise) gave best TTFT P95 = 67ms
#   - online_int4 + fp8 kv-cache gave best sustained TPOT = 3ms
#   - V2 Model Runner = 1 from 1529 (68.13) outperformed V2=0 from 1202 (67.97)
#   - Combining: Humming image + INT4 quantization + FP8 KV Cache
services:
  model:
    image: docker.io/taze05/lfm25-h200-ers@sha256:2f1c6a6e529508932a7db35994f605696fabb6500af3019a49dea9fa148553e9
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - --model=/model
      - --served-model-name=LFM2.5-1.2B-Instruct
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=32768
      - --tensor-parallel-size=1
      - --gpu-memory-utilization=0.95
      - --dtype=bfloat16
      - --quantization=online_int4
      - --kv-cache-dtype=fp8
      - --mamba-cache-dtype=bfloat16
      - --enable-prefix-caching
      - --mamba-cache-mode=align
      - --block-size=16
      - --mamba-block-size=16
      - --prefix-match-unit=16
      - --prefix-caching-hash-algo=xxhash
      - --no-disable-cascade-attn
      - --enable-chunked-prefill
      - --max-num-batched-tokens=1024
      - --max-num-seqs=256
      - --async-scheduling
      - --optimization-level=3
      - --performance-mode=interactivity
      - --disable-log-stats
      - --disable-uvicorn-access-log
    environment:
      # Humming W4 channel-wise quantization (from 0851 champion)
      BTS_ONLINE_HUMMING_BLOCKS: "1"
      VLLM_HUMMING_ONLINE_QUANT_CONFIG: '{"dtype":"int4","group_size":0}'
      # INT4 Marlin backend (from 1529 champion)
      BTS_ONLINE_INT4_BACKEND: marlin
      BTS_ONLINE_INT4_GROUP_SIZE: "128"
      BTS_ONLINE_INT4_LM_HEAD: "1"
      BTS_ONLINE_INT4_LM_HEAD_BACKEND: auto
      # V2 Model Runner (1529 used V2=1 and scored higher than 1202 with V2=0)
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_USE_FASTOKENS: "1"
      # Offline & deterministic
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
      TOKENIZERS_PARALLELISM: "false"
      # Thread pinning
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    shm_size: "2g"
    stop_grace_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
