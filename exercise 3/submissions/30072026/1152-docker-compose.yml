# CRITICAL INSIGHT: max-model-len=8192 (spec says max context = 4700 tokens)
# + TPOT must reach 2ms for 80 ERS (current 3ms gives theoretical max ~72)
#
# Changes from 0851 champion (68.38):
#   1. max-model-len: 32768 → 8192 (free massive VRAM, faster CUDA Graph)
#   2. online_int4 + fp8 KV cache (from 1529 which had TPOT=3ms stable)
#   3. Humming W4 channel-wise from champion image
#   4. gpu-memory-utilization: 0.95 → 0.98 (smaller model-len = safer)
#   5. max-num-batched-tokens: 1024 → 2048 (more VRAM headroom allows bigger prefill batches)
#   6. max-num-seqs: 256 → 512 (more concurrent sequences = better throughput)
services:
  model:
    image: docker.io/taze05/lfm25-h200-ers@sha256:2f1c6a6e529508932a7db35994f605696fabb6500af3019a49dea9fa148553e9
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - --model=/model
      - --served-model-name=LFM2.5-1.2B-Instruct
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=8192
      - --tensor-parallel-size=1
      - --gpu-memory-utilization=0.98
      - --dtype=bfloat16
      - --quantization=online_int4
      - --kv-cache-dtype=fp8
      - --mamba-cache-dtype=bfloat16
      - --enable-prefix-caching
      - --mamba-cache-mode=align
      - --block-size=16
      - --mamba-block-size=16
      - --prefix-match-unit=16
      - --prefix-caching-hash-algo=xxhash
      - --no-disable-cascade-attn
      - --enable-chunked-prefill
      - --max-num-batched-tokens=2048
      - --max-num-seqs=512
      - --async-scheduling
      - --optimization-level=3
      - --performance-mode=interactivity
      - --disable-log-stats
      - --disable-uvicorn-access-log
    environment:
      # Humming W4 channel-wise (from 0851 champion image)
      BTS_ONLINE_HUMMING_BLOCKS: "1"
      VLLM_HUMMING_ONLINE_QUANT_CONFIG: '{"dtype":"int4","group_size":0}'
      # INT4 Marlin backend (from 1529 68.13)
      BTS_ONLINE_INT4_BACKEND: marlin
      BTS_ONLINE_INT4_GROUP_SIZE: "128"
      BTS_ONLINE_INT4_LM_HEAD: "1"
      BTS_ONLINE_INT4_LM_HEAD_BACKEND: auto
      # V2 Model Runner ON (1529 scored higher with V2=1)
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_USE_FASTOKENS: "1"
      # Offline & deterministic
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
      TOKENIZERS_PARALLELISM: "false"
      # Thread pinning
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    shm_size: "2g"
    stop_grace_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
