# SLOT 3: CUDA GRAPH FULL MODE FIX (Target: 70+ ERS)
# Kế thừa 100% từ Kỷ lục điểm cao nhất (Slot 0851 - 68.38 ERS)
# - Base Image: sha256:2f1c
# - Quantization: fp8 (giống hệt 0851)
# - KV Cache: bfloat16 (giống hệt 0851)
# Nâng cấp:
# - Bật V2 Model Runner
# - Thêm Cuda Graph Full Mode Capture
services:
  model:
    image: docker.io/taze05/lfm25-h200-ers@sha256:2f1c6a6e529508932a7db35994f605696fabb6500af3019a49dea9fa148553e9
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - --model=/model
      - --served-model-name=LFM2.5-1.2B-Instruct
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=32768
      - --tensor-parallel-size=1
      - --gpu-memory-utilization=0.90
      - --dtype=bfloat16
      - --quantization=fp8
      - --kv-cache-dtype=bfloat16
      - --mamba-cache-dtype=bfloat16
      - --enable-prefix-caching
      - --mamba-cache-mode=align
      - --block-size=16
      - --mamba-block-size=16
      - --prefix-match-unit=16
      - --prefix-caching-hash-algo=xxhash
      - --no-disable-cascade-attn
      - --enable-chunked-prefill
      - --max-num-batched-tokens=1024
      - --max-num-seqs=256
      - --async-scheduling
      - --optimization-level=3
      - --performance-mode=interactivity
      - --max-cudagraph-capture-size=1024
      - --cudagraph-capture-sizes
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"
      - "6"
      - "7"
      - "8"
      - "9"
