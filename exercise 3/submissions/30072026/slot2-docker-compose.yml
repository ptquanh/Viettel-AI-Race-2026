# ULTIMATE CHAMPION PHASE 3 COMPOSE
# Base Image: ptquanh/sandbox-runtime:phase3 (built directly from sha256:2f1c champion)
# Features:
#   1. Best TTFT P95: 67ms (from sha256:2f1c Humming W4 champion)
#   2. Decode-Priority Scheduler Patch (from Phase 3)
#   3. DECODE_PREFILL_CAP=192 (prevents request timeouts while keeping TTFT P50 ~44ms)
# Expected Score: > 69.5 ERS (Breaking All-Time Record 68.38!)
services:
  model:
    image: docker.io/ptquanh/sandbox-runtime:phase3
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - --model=/model
      - --served-model-name=LFM2.5-1.2B-Instruct
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=32768
      - --tensor-parallel-size=1
      - --gpu-memory-utilization=0.95
      - --dtype=bfloat16
      - --quantization=fp8
      - --kv-cache-dtype=bfloat16
      - --mamba-cache-dtype=bfloat16
      - --enable-prefix-caching
      - --mamba-cache-mode=align
      - --block-size=16
      - --mamba-block-size=16
      - --prefix-match-unit=16
      - --prefix-caching-hash-algo=xxhash
      - --no-disable-cascade-attn
      - --enable-chunked-prefill
      - --max-num-batched-tokens=1024
      - --max-num-seqs=256
      - --async-scheduling
      - --optimization-level=3
      - --performance-mode=interactivity
      - --disable-log-stats
      - --disable-uvicorn-access-log
    environment:
      # === PHASE 3 SCHEDULER DECODE PRIORITY ===
      DECODE_PREFILL_CAP: "192"
      
      # === EXACT MATCH WITH 0851 CHAMPION ===
      DO_NOT_TRACK: "1"
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
      TOKENIZERS_PARALLELISM: "false"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
      VLLM_USE_FASTOKENS: "1"
      VLLM_USE_V2_MODEL_RUNNER: "0"
    ports:
      - "8000:8000"
    shm_size: "2g"
    stop_grace_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
