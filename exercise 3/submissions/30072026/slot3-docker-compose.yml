# Phase 3 PERFECTED: DECODE_PREFILL_CAP = 256 (Target: 69+ ERS)
# Rationale:
#   - We revert BACK to the exact config of Slot 1630 (which scored 68.20 ERS)
#   - We are using the successfully pushed ptquanh/sandbox-runtime:phase3 (which is based on dc9e)
#   - The ONLY change vs 1630 is increasing DECODE_PREFILL_CAP from 128 to 256
#   - This will eliminate the 9 timeouts that cost us ~0.8 ERS points in slot 1630
services:
  model:
    image: docker.io/ptquanh/sandbox-runtime:phase3
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - --model=/model
      - --served-model-name=LFM2.5-1.2B-Instruct
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=32768
      - --tensor-parallel-size=1
      - --gpu-memory-utilization=0.95
      - --dtype=bfloat16
      - --quantization=online_int4
      - --kv-cache-dtype=fp8
      - --mamba-cache-dtype=bfloat16
      - --enable-prefix-caching
      - --mamba-cache-mode=align
      - --block-size=16
      - --mamba-block-size=16
      - --prefix-match-unit=16
      - --prefix-caching-hash-algo=xxhash
      - --no-disable-cascade-attn
      - --enable-chunked-prefill
      - --max-num-batched-tokens=1024
      - --max-num-seqs=256
      - --async-scheduling
      - --optimization-level=3
      - --performance-mode=interactivity
      - --disable-log-stats
      - --disable-uvicorn-access-log
    environment:
      # === PHASE 3 DECODE PRIORITY ===
      # Increased from 128 (slot 1630) to 256 to stop the 9 requests from timing out
      DECODE_PREFILL_CAP: "256"
      
      # === Quantization config (Exactly as 1630) ===
      BTS_ONLINE_HUMMING_BLOCKS: "1"
      BTS_ONLINE_INT4_BACKEND: marlin
      BTS_ONLINE_INT4_GROUP_SIZE: "128"
      BTS_ONLINE_INT4_LM_HEAD: "1"
      BTS_ONLINE_INT4_LM_HEAD_BACKEND: auto
      VLLM_HUMMING_ONLINE_QUANT_CONFIG: '{"dtype":"int4","group_size":0}'
      
      # === Engine config (Exactly as 1630) ===
      VLLM_USE_V2_MODEL_RUNNER: "0"
      VLLM_USE_FASTOKENS: "1"
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
      
      # === Offline ===
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      
      # === Thread pinning ===
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    shm_size: "2g"
    stop_grace_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
