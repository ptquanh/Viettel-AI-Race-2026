# KỶ LỤC PHASE 3 TRÊN ĐÚNG BASE CHAMPION 0851 (68.38 ERS)
# - Trả lại nguyên vẹn config gốc của 0851 (Không thêm bất kỳ flag INT4 nào)
# - Chỉ thêm DECODE_PREFILL_CAP=256 để áp dụng patch
services:
  model:
    image: docker.io/ptquanh/sandbox-runtime:phase3
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - --model=/model
      - --served-model-name=LFM2.5-1.2B-Instruct
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=32768
      - --tensor-parallel-size=1
      - --gpu-memory-utilization=0.95
      - --dtype=bfloat16
      - --quantization=fp8
      - --kv-cache-dtype=bfloat16
      - --mamba-cache-dtype=bfloat16
      - --enable-prefix-caching
      - --mamba-cache-mode=align
      - --block-size=16
      - --mamba-block-size=16
      - --prefix-match-unit=16
      - --prefix-caching-hash-algo=xxhash
      - --no-disable-cascade-attn
      - --enable-chunked-prefill
      - --max-num-batched-tokens=1024
      - --max-num-seqs=256
      - --async-scheduling
      - --optimization-level=3
      - --performance-mode=interactivity
      - --disable-log-stats
      - --disable-uvicorn-access-log
    environment:
      # === PHASE 3 SCHEDULER DECODE PRIORITY ===
      DECODE_PREFILL_CAP: "256"
      
      # === CÁC FLAG BẮT BUỘC (GIỮ NGUYÊN NHƯ 0851 CHAMPION) ===
      DO_NOT_TRACK: "1"
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
      TOKENIZERS_PARALLELISM: "false"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
      VLLM_USE_FASTOKENS: "1"
      VLLM_USE_V2_MODEL_RUNNER: "0"
    ports:
      - "8000:8000"
    shm_size: "2g"
    stop_grace_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
